[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rolling-chunk-dedup"
version = "0.1.0"
description = "Content-defined chunking and a bounded deduplicating archive with reconstruction audits"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "matplotlib>=3.10", "numpy>=2.2,<3"]

[project.scripts]
rolling-dedup = "rolling_dedup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]
